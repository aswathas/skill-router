title: "Capability Routing for Agent Skill Libraries"
subtitle: "A taxonomy, a router, and an evidence-driven learning loop for over 4,200 installed skills"

authors:
  - name: "Aswath A S"
    affiliation: "Independent researcher"

abstract: |
  Coding agents increasingly ship with large libraries of skills: reusable instruction bundles that each describe one kind of job. Surfacing every skill in the prompt is unaffordable, and choosing the wrong one wastes the context window and the user's time. We present a capability-routing system for agent skill libraries, built and evaluated on one machine with over 4,200 installed skills. The system has four coupled parts: a host-level catalog gate that hides skills the agent never needs, a hand-curated capability taxonomy with evidence-based tagging, a router that resolves a free-text need to exactly one skill, and a learning loop that scores skills from what actually happens in a session rather than from the request text. The router reaches 0.849 capability top-1 accuracy against 0.614 for a faithfully reimplemented pre-fix matcher and 0.477 for Okapi BM25 over skill descriptions, and raises an on-topic rate from 0.460 to 0.795, while the runtime catalog falls from 1,241 skills to 36 and the catalog listing cost from 1.87M tokens to 62.1K. We make the taxonomy, not the ranker, the object of study: an error analysis shows that 98 of 101 failures were cases where the request never named the expected capability, and repairing the taxonomy on one half of the benchmark lifts accuracy from 0.661 to 0.849 on the other half (p = 1.7e-14). We also report three negative results: the outcome ledger does not measurably improve routing at the scale of our evidence, BM25 ties the full router on exact-skill selection, and per-invocation token cost rises as accuracy rises.

